[project]
name = "tessera"
version = "0.2.0"
description = "Content-adaptive image tokenizer: a 2:1 k-d tree of FLUX.2 latent tiles, one layout per image, accepted by a frozen perceptual Judge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "click",
    "lpips",
    "DISTS-pytorch",
    "diffusers==0.42.1",
    "safetensors",
    "huggingface_hub",
]

[project.scripts]
tessera = "tessera.rect.encode:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
